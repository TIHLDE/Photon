version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns:
                  - "*"
      ignore:
          # No tag there has the inputs deploy.yml passes, so moving to the
          # newest tag would break the next deploy.
          - dependency-name: "tihlde/tihlde-workflows*"
