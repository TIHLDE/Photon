name: CI/CD

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        name: Check backend changes
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            backend: ${{ steps.filter.outputs.backend }}
        steps:
            - uses: actions/checkout@v3
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  # Only a PR/push changing exclusively apps/kvark can skip tests.
                  predicate-quantifier: every
                  filters: |
                      backend:
                        - '**'
                        - '!apps/kvark/**'
                        - '!README.md'
                        - '!scripts/**'
    check:
        name: Check Code Quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 1
            - name: Setup Tools
              uses: tihlde/tihlde-workflows/.github/setup-bun@v1

            - name: Check linting
              run: bun run lint

            - name: Check formatting
              run: bun run format

            # Drizzle applies migrations by journal timestamp, not by index, and
            # silently skips any that are not newer than the last one applied.
            - name: Check migration order
              run: bun run db:check-order

            - name: Check building
              run: bun run build

            - name: Check types
              run: bun run typecheck
    api-tests:
        name: API Tests (${{ matrix.shard }})
        needs: [check, changes]
        if: needs.changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: ["1/2", "2/2"]
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 1
            - name: Setup Tools
              uses: tihlde/tihlde-workflows/.github/setup-bun@v1

            - name: Run API test shard
              env:
                  MAX_TEST_WORKERS: 2
              run: bun run test -- --filter=@photon/api --log-order=stream -- --shard=${{ matrix.shard }}

    other-tests:
        name: Other Tests
        needs: [check, changes]
        if: needs.changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 1
            - name: Setup Tools
              uses: tihlde/tihlde-workflows/.github/setup-bun@v1

            - name: Run non-API tests
              run: bun run test -- --filter='!@photon/api' --log-order=stream
