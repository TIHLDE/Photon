name: CI/CD

on:
    pull_request:
        branches:
            - dev
            - main
    push:
        branches:
            - dev
            - main

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check Code Quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 1
            - name: Setup Tools
              uses: tihlde/tihlde-workflows/.github/setup-bun@v1

            - name: Check linting
              run: bun run lint

            # Drizzle applies migrations by journal timestamp, not by index, and
            # silently skips any that are not newer than the last one applied.
            - name: Check migration order
              run: bun run db:check-order

            - name: Check types
              run: bun run typecheck

            - name: Check building
              run: bun run build

    api-tests:
        name: API Tests (${{ matrix.shard }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                shard: ["1/2", "2/2"]
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 1
            - name: Setup Tools
              uses: tihlde/tihlde-workflows/.github/setup-bun@v1

            - name: Run API test shard
              working-directory: apps/api
              env:
                  MAX_TEST_WORKERS: 2
              run: bun run test -- --shard=${{ matrix.shard }}

    other-tests:
        name: Other Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 1
            - name: Setup Tools
              uses: tihlde/tihlde-workflows/.github/setup-bun@v1

            - name: Run non-API tests
              run: bun run test -- --filter='!@photon/api' --log-order=stream
