name: production

services:
    photon.tihlde.org:
        container_name: photon.tihlde.org
        build:
            context: ../..
            dockerfile: infra/docker/Dockerfile
        restart: unless-stopped
        ports:
            - "${BINDING_IP_ADDRESS:-127.0.0.1}:4000:4000"
        env_file:
            - "../../.env"
        depends_on:
            - photon.tihlde.org-redis
    photon.tihlde.org-redis:
        container_name: photon.tihlde.org-redis
        # Pinnet til major 8, som `redis:alpine` peker på i dag — samme digest,
        # så dette endrer ingenting nå. Uten pinningen kan `pull_policy: always`
        # dra inn en ny major på en hvilken som helst deploy, og BullMQ er
        # følsom for hvilken Redis den snakker med.
        image: redis:8-alpine
        pull_policy: always
        restart: unless-stopped
